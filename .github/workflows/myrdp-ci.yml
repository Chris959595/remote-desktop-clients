# Generato da MyRDP Builder: compila myRDP-app su GitHub Actions.
name: Build MyRDP

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'myRDP-app/**'
      - 'gradle.properties'
      - '.github/workflows/myrdp-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (preinstallato sul runner)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Scarica librerie native precompilate (FreeRDP, OpenSSL...)
        run: |
          chmod +x download-prebuilt-dependencies.sh bVNC/prepare_project.sh gradlew
          ./download-prebuilt-dependencies.sh
          ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Allinea FreeRDP precompilato alle patch Java correnti
        run: |
          cd remoteClientLib/jni/libs/deps/FreeRDP
          for f in ../../*_freerdp_*.patch; do
            # solo patch che toccano il client Android Java/Gradle; quelle gia' presenti vengono saltate
            if grep -q '^+++ b/client/Android/Studio/' "$f"; then
              echo "== $(basename "$f")"
              patch -N -t -p1 -r - < "$f" || echo "   (gia' applicata o non necessaria)"
            fi
          done

      - name: Prepara keystore di firma
        env:
          KS_B64: ${{ secrets.MYRDP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/myrdp.p12"
            echo "MYRDP_KEYSTORE=$RUNNER_TEMP/myrdp.p12" >> "$GITHUB_ENV"
            echo "Keystore configurato."
          else
            echo "::warning::Secret MYRDP_KEYSTORE_BASE64 assente: APK firmato con chiave di debug."
          fi

      - name: Compila APK
        env:
          MYRDP_KEYSTORE_PASSWORD: ${{ secrets.MYRDP_KEYSTORE_PASSWORD }}
          MYRDP_KEY_ALIAS: ${{ secrets.MYRDP_KEY_ALIAS }}
          MYRDP_KEY_PASSWORD: ${{ secrets.MYRDP_KEY_PASSWORD }}
        run: ./gradlew :myRDP-app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: myRDP-apk
          path: myRDP-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
